name: Deploy frontend to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-frontend
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          VITE_BACKEND_ORIGIN: https://api.bridgeonit.com
      - name: Package production files
        run: tar -C dist -czf "$RUNNER_TEMP/frontend.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/frontend.tar.gz
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ github.sha }}
      - name: Deploy and verify public HTTPS
        env:
          DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          key="$RUNNER_TEMP/bridgeon-deploy-key"
          hosts="$RUNNER_TEMP/bridgeon-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          digest="$(sha256sum frontend.tar.gz | cut -d' ' -f1)"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            ubuntu@43.203.46.32 "deploy $COMMIT $digest" < frontend.tar.gz
          curl --fail --silent --show-error https://bridgeonit.com/ > /dev/null
          printf '%s\n' "Deployed frontend $COMMIT to https://bridgeonit.com"

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BridgeOn</title>
    <!-- 링크를 메신저에 붙였을 때 보이는 미리보기. 그림은 public/og-image.png (1200×630) -->
    <meta
      name="description"
      content="PPT·PDF 강의자료를 올리면 그림·표 설명문과 점역 지침에 맞춘 DOCX·TXT 초안을 만들어요. 점역가는 검수부터 시작할 수 있어요."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BridgeOn" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://bridgeonit.com/" />
    <meta property="og:title" content="BridgeOn - 점역가와 학습자를 잇는 AI 대체자료 제작 보조 플랫폼" />
    <meta
      property="og:description"
      content="PPT·PDF 강의자료를 올리면 그림·표 설명문과 점역 지침에 맞춘 DOCX·TXT 초안을 만들어요."
    />
    <meta property="og:image" content="https://bridgeonit.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="BridgeOn 로고와 '점역가와 학습자를 잇는 AI 대체자료 제작 보조 플랫폼' 문구"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 화면 설정(고대비·글자 크기)을 첫 화면 그리기 전에 적용해 깜빡임을 막는다. src/lib/displaySettings.ts와 같은 키 -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('bridgeon-display') || '{}')
        if (s.highContrast === true) document.documentElement.dataset.contrast = 'high'
        if (s.textSize === 'large' || s.textSize === 'xlarge') document.documentElement.dataset.textSize = s.textSize
      } catch (e) {}
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
